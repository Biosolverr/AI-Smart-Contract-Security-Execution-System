<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>GenRoute Firewall</title>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      padding: 20px;
    }

    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 6px;
      border: none;
    }

    input { width: 400px; }

    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .safe { color: #22c55e; }
    .warn { color: #f59e0b; }
    .danger { color: #ef4444; }
  </style>
</head>

<body>

<h1>🛡 GenRoute AI Firewall</h1>

<input id="input" placeholder="Enter input..." />
<button onclick="run()">Run</button>

<div id="result" class="card"></div>

<h2>📊 Attack Logs</h2>
<button onclick="loadLogs()">Refresh Logs</button>
<div id="logs"></div>

<script type="module">
import { routeInput, getLogs } from "./app.js";

async function run() {
  const input = document.getElementById("input").value;

  const res = await routeInput(input);

  let cls = "safe";
  if (res.attack_score > 70) cls = "danger";
  else if (res.attack_score > 30) cls = "warn";

  document.getElementById("result").innerHTML = `
    <h3>Result</h3>
    <p>Status: <b class="${cls}">${res.attack_score > 70 ? "BLOCKED" : "OK"}</b></p>
    <p>Executor: ${res.executor}</p>
    <p>Confidence: ${res.confidence}</p>
    <p class="${cls}">Attack Score: ${res.attack_score}</p>
    <p>Consensus: ${res.consensus_used}</p>
  `;
}

async function loadLogs() {
  const logs = await getLogs();

  let html = "";

  for (let log of logs) {
    let cls = "safe";
    if (log.severity > 70) cls = "danger";
    else if (log.severity > 30) cls = "warn";

    html += `
      <div class="card">
        <p><b>${log.input}</b></p>
        <p class="${cls}">Score: ${log.severity}</p>
        <p>${log.label}</p>
      </div>
    `;
  }

  document.getElementById("logs").innerHTML = html;
}

window.run = run;
window.loadLogs = loadLogs;
</script>

</body>
</html>
